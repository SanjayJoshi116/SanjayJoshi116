# Source of truth for the profile SVGs in assets/ and the generated README regions
# (hero, featured, all projects, stack).
# Edit this file and push; .github/workflows/render-profile.yml regenerates them.
# Run locally: python scripts/render_profile.py

user: SanjayJoshi116
