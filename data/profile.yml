  # asset, README or log; the renderer fails if one would be.
  # Each project is listed under "All projects". Entries with a `card` are the
  # featured private candidates. `card.repo` is "owner/name"; rotation by pushed_at
  # only happens when every card has a repo the token can read, otherwise the first
  # 2 cards in file order are featured.
  private:
    - title: SwingTrade AI
      version: v0.41
      summary: NSE swing-trade screener with 21 setup detectors, regime detection, risk-based sizing, alerts and a 22-strategy backtester
