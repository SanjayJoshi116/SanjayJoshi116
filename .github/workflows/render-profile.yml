name: Render profile

on:
  schedule:
    - cron: "17 2 * * *" # daily forced render, 07:47 IST
    - cron: "47 0-17 * * *" # hourly poll, 06:17–23:17 IST; renders only if a repo was pushed or the IST day changed
  push:
    branches: [main]
    paths:
      - data/profile.yml
      - scripts/render_profile.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # Render from the branch tip, not the triggering SHA, so queued runs don't start stale.
      # ref_name is main for push/schedule and the chosen branch for workflow_dispatch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml==6.0.2

      # Push-time digest saved by the last successful render. A miss counts as changed.
      - uses: actions/cache/restore@v4
        with:
          path: .push-fp/last
          key: push-fp-${{ github.run_id }}
          restore-keys: push-fp-

      # Logs are public: the fingerprint step prints nothing, and the gate prints only the verdict.
      - run: python scripts/render_profile.py --fingerprint .push-fp/now
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - id: gate
        run: |
          if [ "$EVENT" = schedule ] && [ "$CRON" != "17 2 * * *" ] \
             && [ "$(cat .push-fp/now)" != error ] && cmp -s .push-fp/now .push-fp/last; then
            echo "unchanged"
            echo "render=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed"
            echo "render=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}

      # Fails (and writes nothing) if the token is missing/invalid or any API call fails.
      - if: steps.gate.outputs.render == 'true'
        run: python scripts/render_profile.py --require-token
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Commit if changed
        if: steps.gate.outputs.render == 'true'
        run: |
          git add assets README.md
          if git diff --cached --quiet; then
            echo "Assets unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile assets"
          # main may have moved during the run; replay on top, keeping this render's assets.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          done
          exit 1

      # Saved only after a successful render, so a failed one is retried on the next poll.
      - id: keep
        if: steps.gate.outputs.render == 'true'
        run: |
          if [ "$(cat .push-fp/now)" = error ]; then
            echo "save=false" >> "$GITHUB_OUTPUT"
          else
            cp .push-fp/now .push-fp/last
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.keep.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: .push-fp/last
          key: push-fp-${{ github.run_id }}
