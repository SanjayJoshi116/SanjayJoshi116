name: Render profile

on:
  schedule:
    - cron: "17 2 * * *" # daily, 07:47 IST
  push:
    branches: [main]
    paths:
      - data/profile.yml
      - scripts/render_profile.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # Render from the branch tip, not the triggering SHA, so queued runs don't start stale.
      # ref_name is main for push/schedule and the chosen branch for workflow_dispatch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml==6.0.2

      # Fails (and writes nothing) if the token is missing/invalid or any API call fails.
      - run: python scripts/render_profile.py --require-token
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Commit if changed
        run: |
          git add assets README.md
          if git diff --cached --quiet; then
            echo "Assets unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile assets"
          # main may have moved during the run; replay on top, keeping this render's assets.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          done
          exit 1
